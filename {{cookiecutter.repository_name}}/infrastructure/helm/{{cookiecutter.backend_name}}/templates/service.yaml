apiVersion: v1
kind: Service
metadata:
  name: {{cookiecutter.gcp_backend_service_name}}
  labels:
    app: {{ "{{" }} .Chart.Name {{ "}}" }}
    release: {{ "{{" }} .Release.Name {{ "}}" }}
spec:
  type: {{ "{{" }} .Values.service.type {{ "}}" }}
  ports:
    - port: {{ "{{" }} .Values.service.port {{ "}}" }}
      targetPort: {{ "{{" }} .Values.service.port {{ "}}" }}
  selector:
    app: {{ "{{" }} .Chart.Name {{ "}}" }}
    release: {{ "{{" }} .Release.Name {{ "}}" }}

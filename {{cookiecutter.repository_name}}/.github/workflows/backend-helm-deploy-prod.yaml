name: Backend Helm deploy (prod)

on:
  push:
    branches:
      - {{cookiecutter.prod_branch}}
    paths:
      - backend/**

jobs:
  backend-helm-deploy:
    name: "Deploy backend via Helm on prod"
    runs-on: ubuntu-latest

    steps:
    - id: backend-helm-deploy-checkout
      name: "Checkout repository"
      uses: actions/checkout@v3

    - id: backend-helm-deploy-setup-gcp
      name: "Set up Google Cloud SDK"
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: "latest"
        service_account_key: {{ "${{" }} secrets.GCP_SERVICE_ACCOUNT_KEY_PROD {{ "}}" }}
        project_id: {{ "${{" }} secrets.GCP_PROJECT_ID_PROD {{ "$}}" }}

    - id: backend-helm-deploy-configure
      name: "Configure Docker to use gcloud"
      run: |
        gcloud auth configure-docker europe-docker.pkg.dev

    - id: backend-helm-deploy-build
      name: "Build Docker image"
      run: |
        docker build backend/. -t europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_PROD {{ "}}" }}/backend/{{cookiecutter.backend_image_name}}:{{cookiecutter.prod_image_tag}} .

    - id: backend-helm-deploy-push
      name: "Push Docker image to GCP Artifact Registry"
      run: |
        docker push europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_PROD {{ "}}" }}/backend/{{cookiecutter.backend_image_name}}:{{cookiecutter.prod_image_tag}} 

    - id: backend-helm-deploy-setup-helm
      name: "Set up Helm"
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - id: backend-helm-deploy-deploy
      name: Helm deploy
      run: |
        helm upgrade --install my-release my-chart --set image.repository=europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_PROD {{ "}}" }}/backend/{{cookiecutter.backend_image_name}} --set image.tag={{cookiecutter.prod_image_tag}}

name: Frontend Helm deploy (dev)

on:
  push:
    branches:
      - {{cookiecutter.dev_branch}}
    paths:
      - frontend/**

jobs:
  frontend-helm-deploy:
    name: "Deploy frontend via Helm on dev"
    runs-on: ubuntu-latest

    steps:
    - id: frontend-helm-deploy-checkout
      name: "Checkout repository"
      uses: actions/checkout@v3

    - id: frontend-helm-deploy-setup-gcp
      name: "Set up Google Cloud SDK"
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: "latest"
        service_account_key: {{ "${{" }} secrets.GCP_SERVICE_ACCOUNT_KEY_DEV {{ "}}" }}
        project_id: {{ "${{" }} secrets.GCP_PROJECT_ID_DEV {{ "$}}" }}

    - id: frontend-helm-deploy-configure
      name: "Configure Docker to use gcloud"
      run: |
        gcloud auth configure-docker europe-docker.pkg.dev

    - id: frontend-helm-deploy-build
      name: "Build Docker image"
      run: |
        docker build frontend/. -t europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_DEV {{ "}}" }}/frontend/{{cookiecutter.frontend_image_name}}:{{cookiecutter.dev_image_tag}} .

    - id: frontend-helm-deploy-push
      name: "Push Docker image to GCP Artifact Registry"
      run: |
        docker push europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_DEV {{ "}}" }}/frontend/{{cookiecutter.frontend_image_name}}:{{cookiecutter.dev_image_tag}}

    - id: frontend-helm-deploy-setup-helm
      name: "Set up Helm"
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    - id: frontend-helm-deploy-deploy
      name: Helm deploy
      run: |
        helm upgrade --install my-release my-chart --set image.repository=europe-docker.pkg.dev/{{ "${{" }} secrets.GCP_PROJECT_ID_DEV {{ "}}" }}/frontend/{{cookiecutter.frontend_image_name}} --set image.tag={{cookiecutter.dev_image_tag}}

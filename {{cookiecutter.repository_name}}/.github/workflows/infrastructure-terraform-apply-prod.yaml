name: Terraform Apply (prod)

on:
  push:
    branches:
      - {{cookiecutter.prod_branch}}
    paths:
      - infrastructure/prod/**

jobs:
  terraform-apply:
    name: "Apply the Terraform changes on prod"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - id: terraform-apply-checkout
        name: "Checkout repository"
        uses: actions/checkout@v3

      - id: terraform-apply-environment
        name: "Set environment variables"
        run: |
          echo "TF_WORKSPACE={{cookiecutter.tf_cloud_workspace}}" >> $GITHUB_ENV
          echo "TF_LOCAL_DIRECTORY=infrastructure/prod/." >> $GITHUB_ENV
          echo "TF_CLOUD_ORGANIZATION={{cookiecutter.tf_cloud_organization}}" >> $GITHUB_ENV
          echo "TF_API_TOKEN={{ "${{" }} secrets.TF_TOKEN {{ "}}" }}" >> $GITHUB_ENV
      
      - id: terraform-apply-upload
        name: "Upload config to Terraform Cloud"
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        with:
          workspace: "{{cookiecutter.tf_cloud_workspace}}"
          directory: "infrastructure/prod/."
          speculative: true

      - id: terraform-apply-create
        name: "Create Terraform plan"
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        with:
          workspace: "{{cookiecutter.tf_cloud_workspace}}"
          configuration_version: "{{ "${{" }} steps.terraform-apply-upload.outputs.configuration_version_id {{ "}}" }}"
          plan_only: true

      - id: terraform-apply-apply
        name: "Apply Terraform plan"
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
        if: fromJSON(steps.terraform-apply-create.outputs.payload).data.attributes.actions.IsConfirmable
        with:
          run: {{ "${{" }} steps.terraform-apply-create.outputs.run_id {{ "}}" }}
          comment: "Apply Run from GitHub Actions CI {{ "${{" }} github.sha {{ "}}" }}"
